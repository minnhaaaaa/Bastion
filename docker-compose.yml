services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: splitbrain
      POSTGRES_PASSWORD: splitbrain
      POSTGRES_DB: splitbrain
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/splitbrain-dev
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
volumes:
  pgdata:
  neo4jdata:
